<h2>Student List</h2>

<a href="/add">Add Student</a>

<table border="1">
<tr>
<th>Name</th>
<th>Age</th>
<th>Course</th>
<th>Action</th>
</tr>

{% for student in students %}

<tr>
<td>{{ student.name }}</td>
<td>{{ student.age }}</td>
<td>{{ student.course }}</td>

<td>
<a href="/edit/{{ student._id }}">Edit</a>
<a href="/delete/{{ student._id }}">Delete</a>
</td>

</tr>

{% endfor %}

</table>
